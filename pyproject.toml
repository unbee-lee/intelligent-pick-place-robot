[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucs-contracts"
version = "0.1.0"
description = "Executable contracts for the User Command Station interface"
requires-python = ">=3.9"
dependencies = [
    "jsonschema[format]>=4.23,<5",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "types-jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ucs_contracts = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src", "tests"]
